[package]
name = "microchip-rs"
version = "0.1.0"
authors = ["Florent Uguet <florent.uguet@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
opt-level = 3
debug = true
debug-assertions = false
overflow-checks = false
lto = true
panic = 'abort'
incremental = false
codegen-units = 1

[dev-dependencies]
criterion = "0.7.0"

[dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt", "time", "sync"] }
clap = "4.5.47"
log = "0.4.28"
ratatui = "0.29.0"
rustyline = "17.0.1"
tui-logger = "0.17.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"

[[bench]]
name = "bench"
harness = false

[lib]
name = "microchip_rs"
path = "src/lib/mod.rs"
bench = false

[[bin]]
name = "microchip_rs_bin"
path = "src/bin/main.rs"
bench = false
